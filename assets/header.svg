        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.225;0.2251;1" dur="20s" repeatCount="indefinite"/>
        <rect x="66" y="130" width="3" height="26" rx="1">
          <animate attributeName="x" values="70;675;675;70;70" keyTimes="0;0.075;0.205;0.225;1" dur="20s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.05s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2499;0.25;0.475;0.4751;1" dur="20s" repeatCount="indefinite"/>
        <rect x="70" y="130" width="3" height="26" rx="1">
          <animate attributeName="x" values="70;70;330;330;70;70" keyTimes="0;0.25;0.325;0.455;0.475;1" dur="20s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.05s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4999;0.5;0.725;0.7251;1" dur="20s" repeatCount="indefinite"/>
        <rect x="70" y="130" width="3" height="26" rx="1">
          <animate attributeName="x" values="70;70;531;531;70;70" keyTimes="0;0.5;0.575;0.705;0.725;1" dur="20s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.05s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7499;0.75;0.975;0.9751;1" dur="20s" repeatCount="indefinite"/>
        <rect x="70" y="130" width="3" height="26" rx="1">
          <animate attributeName="x" values="70;70;617;617;70;70" keyTimes="0;0.75;0.825;0.955;0.975;1" dur="20s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.05s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g transform="translate(716,180)">
      <rect x="0" y="-19" width="266" height="28" rx="14" fill="#0F1A17" stroke="#1F3D34" stroke-width="1"/>
      <circle cx="18" cy="-5" r="4.5" fill="#3FB950">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="-5" r="4.5" fill="none" stroke="#3FB950" stroke-width="1.5">
        <animate attributeName="r" values="4.5;11" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="0" font-size="14" fill="#7EE2A8" letter-spacing="0.5">open to AI / DevRel roles</text>
    </g>
  </g>
