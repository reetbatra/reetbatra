<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Reet Batra. I build AI systems other people depend on, and I own what breaks.">
  <title>Reet Batra</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#171326"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F59E0B"/>
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="50%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#E6EDF3"/>
      <animate attributeName="x1" values="-0.6;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.6" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="t0"><rect x="66" y="126" width="0" height="34">
      <animate attributeName="width" values="0;605;605;0;0" keyTimes="0;0.075;0.205;0.225;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t1"><rect x="66" y="126" width="0" height="34">
      <animate attributeName="width" values="0;0;260;260;0;0" keyTimes="0;0.25;0.325;0.455;0.475;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="66" y="126" width="0" height="34">
      <animate attributeName="width" values="0;0;461;461;0;0" keyTimes="0;0.5;0.575;0.705;0.725;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="66" y="126" width="0" height="34">
      <animate attributeName="width" values="0;0;547;547;0;0" keyTimes="0;0.75;0.825;0.955;0.975;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="18" fill="url(#card)" stroke="#232A36" stroke-width="1.5"/>
  <ellipse cx="880" cy="40" rx="260" ry="150" fill="url(#glow)"/>

  <rect x="2" y="2" width="996" height="4" rx="2" fill="url(#sweep)"/>

  <circle cx="880" cy="150" r="2.5" fill="#22D3EE" opacity="0.7">
    <animate attributeName="cy" values="150;120;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="932" cy="176" r="2" fill="#7C3AED" opacity="0.6">
    <animate attributeName="cy" values="176;138;176" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="188" r="1.8" fill="#F59E0B" opacity="0.5">
    <animate attributeName="cy" values="188;158;188" dur="9.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.6;0.08" dur="9.5s" repeatCount="indefinite"/>
