      <text x="66" y="152" clip-path="url(#t1)">I own what breaks.</text>
      <text x="66" y="152" clip-path="url(#t2)">Forward deployed by temperament.</text>
      <text x="66" y="152" clip-path="url(#t3)">Currently shipping on Sarvam AI's SDK.</text>
    </g>

    <g fill="#22D3EE">
